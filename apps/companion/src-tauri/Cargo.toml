[package]
name = "kustom-companion"
version = "0.1.5"
description = "Kustom desktop app (Host + Overlay)"
authors = ["Customs Night"]
edition = "2021"

[lib]
name = "kustom_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kustom-companion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
