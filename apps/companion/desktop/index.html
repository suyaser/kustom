<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kustom</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="app.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <!-- Kustom's window (05-design §9). Every word comes from the Rust view model (src-tauri/src/model.rs);
         this file is structure only, painted by app.js. -->

      <span class="version" id="version"></span>
    </header>

    <div class="scroll" id="scroll">
    <main id="main">
      <!-- Link (9.4) -->
      <section id="screen-link" class="screen" hidden>
        <button type="button" class="link-button back" id="link-back" hidden></button>
        <!-- biome-ignore lint/a11y/useHeadingContent: app.js fills every heading from the Rust view model -->
        <h1 id="link-heading"></h1>
        <ol class="steps">
          <li id="link-step-1"></li>
          <li id="link-step-2"></li>
        </ol>
        <form id="link-form" class="link-form" novalidate>
          <!-- biome-ignore lint/a11y/noLabelWithoutControl: app.js fills the label text from the Rust view model -->
          <label for="code" id="code-label"></label>
          <input id="code" class="code" type="text" inputmode="text" autocomplete="off" spellcheck="false"
            autocapitalize="characters" aria-describedby="link-slot" />
          <button type="submit" class="primary" id="link-button"></button>
          <div id="link-slot" class="slot slot-3"></div>
        </form>
      </section>

      <!-- Home (9.5) -->
      <section id="screen-home" class="screen" hidden>
        <div class="card update-card" id="update-card" hidden>
          <p id="update-text"></p>
          <button type="button" class="primary" id="restart-now"></button>
          <p id="update-line" class="line" role="status"></p>
        </div>

        <div class="card group-card">
          <!-- biome-ignore lint/a11y/useHeadingContent: app.js fills every heading from the Rust view model -->
          <h1 class="group-heading"><span class="label" id="recording-for"></span> <span class="group-name" id="group-name"></span></h1>
          <p class="linked-line" id="linked-line" hidden></p>
          <div id="switcher" class="switcher" hidden>
            <!-- biome-ignore lint/a11y/noLabelWithoutControl: app.js fills the label text from the Rust view model -->
            <label for="group-select" id="switch-label"></label>
            <select id="group-select" aria-describedby="switch-line"></select>
            <p id="switch-line" class="line" role="status"></p>
          </div>
          <button type="button" class="link-button" id="link-another"></button>
        </div>

        <div class="card status-card">
          <div class="row league-row" id="league-row">
            <span class="row-label" id="league-label"></span>
            <span class="row-value">
              <svg class="dot" id="league-dot" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" focusable="false">
                <circle cx="6" cy="6" r="5" class="dot-solid" />
                <circle cx="6" cy="6" r="4.25" class="dot-ring" />
              </svg>
              <span id="league-text"></span>
            </span>
          </div>
          <div class="cant-find" id="cant-find" hidden>
            <p class="cant-find-title">
              <span class="row-label" id="cant-find-label"></span>
              <span class="row-value">
                <svg class="dot" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" focusable="false">
                  <circle cx="6" cy="6" r="4.25" class="dot-ring" />
                </svg>
                <strong id="cant-find-title"></strong>
              </span>
            </p>
            <p id="cant-find-line"></p>
            <div class="buttons">
              <button type="button" class="secondary" id="browse" aria-describedby="league-slot"></button>
              <button type="button" class="secondary" id="try-again" aria-describedby="league-slot"></button>
            </div>
            <p class="muted" id="cant-find-hint"></p>
          </div>
          <div id="league-slot" class="slot" hidden></div>
          <div class="row last-row">
            <span class="row-label" id="last-label"></span>
            <span class="row-value" id="last-value"></span>
          </div>
        </div>

        <button type="button" class="primary wide" id="open-tonight"></button>

        <div class="folder-row">
          <span class="folder-label" id="folder-label"></span>
          <span class="folder-value" id="folder-value"></span>
          <button type="button" class="link-button" id="change-folder" aria-describedby="folder-slot"></button>
        </div>
        <div id="folder-slot" class="slot" hidden></div>
      </section>

      <!-- Old engine still running (9.6) -->
      <section id="screen-old" class="screen" hidden>
        <!-- biome-ignore lint/a11y/useHeadingContent: app.js fills every heading from the Rust view model -->
        <h1 id="old-heading"></h1>
        <p class="lead" id="old-line"></p>
        <p class="muted" id="old-help"></p>
        <button type="button" class="primary wide" id="retry" aria-describedby="old-slot"></button>
        <div id="old-slot" class="slot slot-1"></div>
      </section>

      <!-- Restarting (9.5.4) -->
      <section id="screen-restarting" class="screen restarting" hidden>
        <p role="status" id="restarting-text"></p>
      </section>
    </main>

    <footer id="footer">
      <div class="footer-row">
        <!-- biome-ignore lint/a11y/noLabelWithoutControl: wraps its checkbox; app.js fills the text -->
        <label class="check"><input type="checkbox" id="autostart" /> <span id="autostart-label"></span></label>
        <button type="button" class="link-button" id="open-logs"></button>
      </div>
      <p class="note" id="closing-note" hidden></p>
      <p class="note" id="riot-notice"></p>
    </footer>
    </div>

    <div class="sr-only" id="announcer" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
