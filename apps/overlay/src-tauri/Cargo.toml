[package]
name = "kustom-overlay"
version = "0.1.0"
description = "Kustom Overlay - Fearless bans and lobby synergy"
authors = ["Customs Night"]
edition = "2021"

[lib]
name = "kustom_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kustom-overlay"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
